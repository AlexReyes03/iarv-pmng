spring.application.name=service
server.port=${DC_SERVER_PORT}

# MySQL
spring.datasource.url=jdbc:mysql://${DC_DB_HOST}:${DC_DB_PORT}/${DC_DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DC_DB_USERNAME}
spring.datasource.password=${DC_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
